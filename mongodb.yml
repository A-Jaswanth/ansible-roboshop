- name: mongodb 
  hosts: localhost
  become: yes
  
  vars:

  tasks:
  - name: copying repos
    copy: 
     src: mongo.repo
     dest: /etc/yum.repos.d/mongo.repo

  - name: installing mongodb
    package:
      name: mongodb-org
      state: present

  - name: using service module
    service:
      name: mongod
      state: started
      enabled: yes

  - name: replace in file
    replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: restart
    service:
      name: mongod
      state: restarted
      enabled: yes


